url: https://jonpayneea.github.io/reach.postproc/

template:
  bootstrap: 5
  includes:
    in_header: |
      <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

        const renderMermaid = async () => {
          // pkgdown renders a fenced ```mermaid code block as
          // <pre class="mermaid"><code>...</code></pre>: the class lands on
          // <pre> already, but the diagram source is left nested inside a
          // <code> child. mermaid.run() reads the matched element's own
          // text and cannot see through that nesting, so unwrap it first.
          // (An earlier version of this script looked for
          // "pre code.language-mermaid" instead, which pkgdown has never
          // actually produced here and so never matched anything -- every
          // diagram on this site is written as a raw <pre class="mermaid">
          // HTML block for exactly this reason; this selector is a
          // defensive fallback in case a fenced block is used again.)
          document.querySelectorAll("pre.mermaid > code").forEach((code) => {
            code.parentElement.textContent = code.textContent;
          });

          // Fallback for the originally-assumed shape, in case a future
          // pandoc/commonmark version renders fenced blocks differently.
          document
            .querySelectorAll("pre code.language-mermaid")
            .forEach((code) => {
              const pre = code.parentElement;
              pre.className = "mermaid";
              pre.textContent = code.textContent;
            });

          mermaid.initialize({
            startOnLoad: false,
            securityLevel: "loose",
            theme: "default",
            flowchart: {
              htmlLabels: true,
              useMaxWidth: true
            }
          });

          await mermaid.run({
            querySelector: ".mermaid"
          });
        };

        if (document.readyState === "loading") {
          document.addEventListener(
            "DOMContentLoaded",
            renderMermaid
          );
        } else {
          renderMermaid();
        }
      </script>

